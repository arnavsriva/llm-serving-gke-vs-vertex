[project]
name = "llm-serving-gke-vertex"
version = "0.1.0"
description = "Benchmarking Qwen3-8B serving on GKE (vLLM, TGI) vs. Vertex AI, plus LoRA fine-tuning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "yamllint>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results", ".terraform"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
