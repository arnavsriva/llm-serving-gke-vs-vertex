# Hourly prices behind the "$ per 1M output tokens" column (python -m bench cost).
#
# Rules:
#   * Take each usd_per_hour from the official GCP pricing pages or the Cloud Billing SKU catalog
#     for us-central1, and record where it came from (source) and when (as_of, YYYY-MM-DD).
#   * Set confirmed = true only after the project owner has confirmed the value. Unconfirmed or
#     zero prices are never turned into a $/1M-token figure; the cost column stays empty.
#   * Spot prices vary over time: re-confirm before each benchmark session.
#   * Add more [[targets.<name>.items]] entries for overheads you want included (e.g. the GKE
#     CPU node, $0.134032/h for e2-standard-4, or the $0.10/h control plane if the free tier no
#     longer covers it), so the table states exactly what it counts. As filled in, GKE rows count
#     the GPU node only and the Vertex row counts the endpoint node.

currency = "USD"
region = "us-central1"

[targets.vllm-gke]
description = "vLLM on one g2-standard-8 (1x NVIDIA L4) Spot node in GKE Standard"

[[targets.vllm-gke.items]]
name = "g2-standard-8 Spot VM (8 vCPU, 32 GB, 1x L4): 8 Spot G2 cores + 32 GiB Spot G2 RAM + Spot L4"
usd_per_hour = 0.486496
source = "Cloud Billing Catalog API list prices, results/prices/2026-10-06_catalog_us-central1.json"
as_of = "2026-10-06"
confirmed = false

