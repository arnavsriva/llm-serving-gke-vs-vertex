# Identity of the inference server pods. On GKE, Workload Identity Federation grants IAM roles
# directly to this Kubernetes service account's principal (set up in Terraform):
#   principal://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/
#     PROJECT_ID.svc.id.goog/subject/ns/llm-serving/sa/inference
# so there is no Google service account key and no project-specific annotation in the manifests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
  labels:
    app.kubernetes.io/part-of: llm-serving
automountServiceAccountToken: false
