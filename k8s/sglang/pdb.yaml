# Same policy as k8s/vllm/pdb.yaml: one voluntary disruption at a time, never a blocked drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sglang
  labels:
    app.kubernetes.io/name: sglang
    app.kubernetes.io/part-of: llm-serving
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sglang
