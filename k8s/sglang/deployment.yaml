# SGLang serving Qwen3-8B-AWQ on one NVIDIA L4 (g2-standard-8 Spot node). Same scheduling,
# probes and resources as k8s/vllm so the two engines run under identical conditions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang
  labels:
    app.kubernetes.io/name: sglang
    app.kubernetes.io/component: inference-server
    app.kubernetes.io/part-of: llm-serving
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sglang
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sglang
        app.kubernetes.io/component: inference-server
        app.kubernetes.io/part-of: llm-serving
    spec:
      serviceAccountName: inference
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
        cloud.google.com/gke-spot: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      containers:
        - name: sglang
          # "-runtime" is the slimmer deployment flavour of the release image (no build toolchain).
          image: lmsysorg/sglang:v0.5.21-runtime
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - --model-path=Qwen/Qwen3-8B-AWQ
            - --host=0.0.0.0
            - --port=8000  # SGLang defaults to 30000; 8000 keeps Service and probes identical to vLLM
            - --context-length=8192
            - --reasoning-parser=qwen3
            - --enable-metrics
          env:
            - name: HF_HOME
              value: /data/hf
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 20Gi
              nvidia.com/gpu: "1"
            limits:
              memory: 24Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: model-cache
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 30Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi  # SGLang passes tensors between its processes through shared memory
